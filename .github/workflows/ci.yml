name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['main']
    paths-ignore: ['docs/**']

  push:
    branches: ['main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    needs: backend-lint
    runs-on: ubuntu-latest
    env:
      # NOTE: base + ci only — deliberately does NOT include
      # docker-compose.local.yml, which requires .envs/.local/* files that
      # don't (and shouldn't) exist on the runner.
      COMPOSE_FILE: brain/docker-compose.yml:brain/docker-compose.ci.yml

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Build django image
        run: docker compose build django

      - name: Check DB Migrations
        run: docker compose run --rm django python manage.py makemigrations --check

      - name: Run DB Migrations
        run: docker compose run --rm django python manage.py migrate

      - name: Run Django Tests
        run: docker compose run django pytest

      - name: Tear down the Stack
        run: docker compose down

  frontend-build:
    needs: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
